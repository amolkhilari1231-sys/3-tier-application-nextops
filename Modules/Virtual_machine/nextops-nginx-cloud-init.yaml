#cloud-config
# Azure Linux VM first-boot configuration.
# Installs Nginx and configures it as a reverse proxy to FastAPI on localhost:8000.

package_update: true
package_upgrade: false

packages:
  - nginx
  - curl

write_files:
  - path: /etc/nginx/sites-available/nextops
    owner: root:root
    permissions: '0644'
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;

          server_name _;

          location / {
              proxy_pass http://127.0.0.1:8000;
              proxy_http_version 1.1;

              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;

              proxy_connect_timeout 30s;
              proxy_send_timeout 60s;
              proxy_read_timeout 60s;
          }
      }

runcmd:
  - [bash, -lc, "ln -sfn /etc/nginx/sites-available/nextops /etc/nginx/sites-enabled/nextops"]
  - [bash, -lc, "rm -f /etc/nginx/sites-enabled/default"]
  - [bash, -lc, "nginx -t"]
  - [bash, -lc, "systemctl enable nginx"]
  - [bash, -lc, "systemctl restart nginx"]

final_message: "NextOps VM bootstrap complete: Nginx installed and configured as reverse proxy to 127.0.0.1:8000."
